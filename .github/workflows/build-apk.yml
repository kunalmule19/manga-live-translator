name: Build Offline Manga Translator APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Auto-Fix Folder Structure (If files were placed in root)
        run: |
          mkdir -p app/src/main/java/com/local/mangatranslator
          [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/AndroidManifest.xml || true
          [ -f "MainActivity.kt" ] && mv MainActivity.kt app/src/main/java/com/local/mangatranslator/MainActivity.kt || true
          [ -f "LiveOverlayService.kt" ] && mv LiveOverlayService.kt app/src/main/java/com/local/mangatranslator/LiveOverlayService.kt || true
          [ -f "MangaTranslationEngine.kt" ] && mv MangaTranslationEngine.kt app/src/main/java/com/local/mangatranslator/MangaTranslationEngine.kt || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK & Install Build Tools 35.0.0
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaLiveTranslator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
